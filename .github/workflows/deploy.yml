name: Deploy

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            HOOK="${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
          else
            HOOK="${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
          fi
          curl -f "$HOOK"
