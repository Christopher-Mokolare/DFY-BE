name: KYC ClamAV integration

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clamav-integration:
    name: ClamAV clean, malware and fail-closed tests
    runs-on: ubuntu-latest
    services:
      clamav:
        image: clamav/clamav:1.4-debian13-slim
        ports:
          - 3310:3310
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/3310'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 120s
          --health-retries 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API
        run: dotnet restore DoForYou.API.csproj

      - name: Restore tests
        run: dotnet restore DoForYou.Tests/DoForYou.Tests.csproj

      - name: Run ClamAV integration tests
        env:
          DFY_KYC_CLAMAV_HOST: 127.0.0.1
          DFY_KYC_CLAMAV_PORT: '3310'
        run: >-
          dotnet test DoForYou.Tests/DoForYou.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~ClamAvIdentityDocumentMalwareScannerTests
          --verbosity normal
